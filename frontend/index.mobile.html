<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: gap: content: https://ssl.gstatic.com; style-src * 'self' 'unsafe-inline'; media-src * blob: 'self' 'unsafe-inline'; img-src * 'self' data: content:;">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" type="image/svg+xml" href="/mobile-assets/icon-placeholder.svg" />
  <title>Frappe Learning</title>
  <style>
    /* Initial loading styles */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
    }
    
    .app-loading {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    
    .app-loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .app-loading-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
    }
    
    .app-loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(37, 99, 235, 0.2);
      border-radius: 50%;
      border-top-color: #2563eb;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    
    /* Status bar padding for iOS */
    .ios-status-bar-padding {
      padding-top: env(safe-area-inset-top);
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="app-loading" class="app-loading">
    <img src="/mobile-assets/icon-placeholder.svg" alt="Frappe Learning" class="app-loading-logo">
    <div class="app-loading-spinner"></div>
  </div>
  
  <!-- App root -->
  <div id="app"></div>
  
  <script type="module" src="/src/main-mobile.js"></script>
  <script>
    // Hide loading screen when app is ready
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        const loadingScreen = document.getElementById('app-loading');
        if (loadingScreen) {
          loadingScreen.classList.add('hidden');
          setTimeout(function() {
            loadingScreen.style.display = 'none';
          }, 300);
        }
      }, 1000);
    });
    
    // Add iOS status bar padding if needed
    if (/(iPhone|iPad|iPod)/i.test(navigator.userAgent)) {
      document.body.classList.add('ios-status-bar-padding');
    }
  </script>
</body>
</html>
